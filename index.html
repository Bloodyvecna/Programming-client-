<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, interactive-widget=resizes-content" />
  <title>Puter.js Studio — Dark Edition</title>
  <script src="https://js.puter.com/v2/"></script>
  <style>
    :root {
      --bg-base: #0b0d12;
      --bg-sidebar: #0e1219;
      --bg-surface: #131822;
      --bg-elevated: #1a2130;
      --bg-user: #1d2b45;
      --text-main: #e8ecf4;
      --text-muted: #8c96a8;
      --accent: #4d7cff;
      --accent-soft: rgba(77, 124, 255, 0.16);
      --border: #242d3d;
      --ok: #34c38f;
      --warn: #f1b44c;
      --err: #f46a6a;
      --pear-bg: url("./teto-pera.jpg");
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      min-height: 100vh;
      min-height: 100dvh;
      background: var(--bg-base);
      color: var(--text-main);
      font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    }

    .app-shell {
      display: grid;
      grid-template-columns: 270px 1fr;
      height: 100vh;
      height: 100dvh;
      overflow: hidden;
      position: relative;
    }

    /* Sidebar estilo DeepSeek */
    .sidebar {
      background: var(--bg-sidebar);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 14px;
      gap: 12px;
      z-index: 20;
    }

    .brand-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
    }

    .brand-title {
      font-weight: 700;
      font-size: 0.98rem;
      letter-spacing: 0.2px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: var(--accent);
      box-shadow: 0 0 10px var(--accent);
    }

    .new-chat-btn {
      width: 100%;
      padding: 9px 12px;
      border-radius: 9px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-main);
      font-weight: 600;
      font-size: 0.88rem;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.15s, background 0.15s;
    }

    .new-chat-btn:hover {
      border-color: var(--accent);
      background: var(--accent-soft);
    }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 6px;
      padding-right: 2px;
    }

    .session-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
      padding: 9px 10px;
      border-radius: 8px;
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.84rem;
      text-align: left;
    }

    .session-item:hover {
      background: var(--bg-surface);
      color: var(--text-main);
    }

    .session-item.active {
      background: var(--bg-elevated);
      border-color: var(--border);
      color: var(--text-main);
      font-weight: 600;
    }

    .session-title {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .session-del {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0 4px;
      border-radius: 4px;
    }

    .session-del:hover {
      color: var(--err);
      background: rgba(244, 106, 106, 0.12);
    }

    .sidebar-footer {
      display: flex;
      flex-direction: column;
      gap: 6px;
      border-top: 1px solid var(--border);
      padding-top: 10px;
    }

    .mini-btn {
      width: 100%;
      padding: 7px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg-surface);
      color: var(--text-muted);
      font-size: 0.8rem;
      cursor: pointer;
      text-align: left;
    }

    .mini-btn:hover {
      color: var(--text-main);
      border-color: var(--accent);
    }

    /* Main chat stage */
    .main-stage {
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      min-height: 0;
      overflow: hidden;
      background: var(--bg-base);
    }

    /* Fondo con teto-pera.jpg */
    .pear-backdrop {
      position: absolute;
      inset: 0;
      background-image:
        radial-gradient(circle at 75% 42%, rgba(255, 92, 138, 0.08), transparent 55%),
        var(--pear-bg);
      background-repeat: no-repeat;
      background-position: right 28px bottom 115px;
      background-size: min(240px, 32vw);
      opacity: 0.24;
      pointer-events: none;
      user-select: none;
      touch-action: none;
      z-index: 3;
    }

    .topbar {
      position: relative;
      z-index: 5;
      padding: 10px 18px;
      background: rgba(14, 18, 25, 0.88);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border);
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
    }

    .topbar-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, button, input[type="text"] {
      background: var(--bg-elevated);
      color: var(--text-main);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 0.84rem;
      font-family: inherit;
    }

    button {
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s, opacity 0.15s;
    }

    button:hover:not(:disabled) {
      border-color: var(--accent);
    }

    button:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #ffffff;
      font-weight: 600;
    }

    .fav-btn.active {
      color: #ffd166;
      border-color: #ffd166;
      background: rgba(255, 209, 102, 0.1);
    }

    .model-pill {
      font-size: 0.78rem;
      color: var(--text-muted);
      max-width: 340px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .chat-scroll {
      position: relative;
      z-index: 2;
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 22px 20px 14px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .chat-container {
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .msg {
      padding: 13px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
      white-space: pre-wrap;
      word-break: break-word;
      line-height: 1.5;
      font-size: 0.92rem;
    }

    .msg.user {
      background: rgba(29, 43, 69, 0.9);
      border-color: #324a75;
      align-self: flex-end;
      max-width: 82%;
    }

    .msg.assistant {
      background: rgba(19, 24, 34, 0.9);
      align-self: flex-start;
      max-width: 92%;
    }

    .msg.system {
      background: rgba(26, 33, 48, 0.85);
      color: var(--text-muted);
      font-size: 0.85rem;
      align-self: center;
      max-width: 85%;
    }

    .msg.error {
      background: rgba(58, 22, 28, 0.92);
      border-color: var(--err);
      color: #ffc2c2;
      align-self: flex-start;
      max-width: 92%;
    }

    .msg-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    /* Panel de Logs colapsable */
    .logs-drawer {
      position: relative;
      z-index: 4;
      background: var(--bg-sidebar);
      border-top: 1px solid var(--border);
      max-height: 210px;
      display: none;
      flex-direction: column;
    }

    .logs-drawer.open {
      display: flex;
    }

    .logs-header {
      padding: 7px 18px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 0.78rem;
      color: var(--text-muted);
      background: var(--bg-surface);
    }

    .logs-body {
      flex: 1;
      overflow-y: auto;
      padding: 8px 18px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      font-size: 0.76rem;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .log-line {
      white-space: pre-wrap;
      word-break: break-word;
      color: var(--text-muted);
    }

    .log-line.info { color: #9ec0ff; }
    .log-line.ok { color: var(--ok); }
    .log-line.warn { color: var(--warn); }
    .log-line.err { color: var(--err); }

    /* Composer inferior */
    .composer-wrap {
      position: relative;
      z-index: 5;
      padding: 10px 18px 16px;
      background: rgba(11, 13, 18, 0.92);
      backdrop-filter: blur(8px);
      border-top: 1px solid var(--border);
    }

    .composer {
      max-width: 900px;
      margin: 0 auto;
      background: var(--bg-surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .composer:focus-within {
      border-color: var(--accent);
    }

    .attachments-preview {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
    }

    .chip {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 999px;
      padding: 4px 10px;
      font-size: 0.78rem;
      color: var(--text-main);
    }

    .chip img {
      width: 22px;
      height: 22px;
      border-radius: 4px;
      object-fit: cover;
    }

    .chip button {
      border: none;
      background: transparent;
      color: var(--text-muted);
      padding: 0 3px;
      font-size: 0.88rem;
    }

    .chip button:hover {
      color: var(--err);
    }

    textarea {
      width: 100%;
      min-height: 74px;
      max-height: 220px;
      resize: vertical;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: inherit;
      font-size: 16px;
      line-height: 1.45;
      -webkit-user-select: text;
      user-select: text;
    }

    .composer-bottom {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      justify-content: space-between;
    }

    .tools-left {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      align-items: center;
    }

    .status-text {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-left: 4px;
    }

    .status-text.ok { color: var(--ok); }
    .status-text.err { color: var(--err); }

    .mobile-sidebar-btn {
      display: none;
    }

    @media (max-width: 820px) {
      .app-shell {
        grid-template-columns: 1fr;
      }

      .sidebar {
        position: fixed;
        inset: 0 auto 0 0;
        width: 265px;
        transform: translateX(-100%);
        transition: transform 0.2s ease;
      }

      .sidebar.open {
        transform: translateX(0);
      }

      .mobile-sidebar-btn {
        display: inline-flex;
      }

      .model-pill {
        display: none;
      }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <div class="brand-row">
        <div class="brand-title">
          <span class="brand-dot"></span>
          <span>Puter Studio</span>
        </div>
        <button id="closeSidebarBtn" class="mobile-sidebar-btn" type="button">✕</button>
      </div>

      <button id="newChatBtn" class="new-chat-btn" type="button">+ Nuevo chat</button>

      <div id="sessionsList" class="sessions-list" aria-label="Historial de conversaciones"></div>

      <div class="sidebar-footer">
        <button id="toggleLogsBtn" class="mini-btn" type="button">📋 Ver / Ocultar Logs</button>
        <button id="exportMdBtn" class="mini-btn" type="button">⬇ Exportar Markdown (.md)</button>
        <button id="exportJsonBtn" class="mini-btn" type="button">⬇ Exportar JSON (.json)</button>
        <button id="wipeAllBtn" class="mini-btn" type="button">🗑 Borrar todo el historial</button>
      </div>
    </aside>

    <div class="main-stage">
      <div class="pear-backdrop" aria-hidden="true"></div>

      <header class="topbar">
        <div class="topbar-group">
          <button id="openSidebarBtn" class="mobile-sidebar-btn" type="button">☰</button>

          <select id="categoryFilter" aria-label="Filtrar categoría">
            <option value="all">Todas</option>
            <option value="favorites">★ Favoritos</option>
            <option value="claude">Claude</option>
            <option value="reasoning">Razonamiento</option>
            <option value="coding">Programación</option>
          </select>

          <select id="modelSelect" aria-label="Seleccionar modelo"></select>

          <button id="favToggleBtn" class="fav-btn" type="button" title="Favorito">★</button>
          <span id="modelPill" class="model-pill">Cargando...</span>
        </div>

        <div class="topbar-group">
          <button id="quickLogsBtn" type="button" title="Abrir logs">Logs (<span id="logCount">0</span>)</button>
          <button id="quickExportBtn" type="button" title="Exportar Markdown">Exportar .md</button>
        </div>
      </header>

      <div id="chatScroll" class="chat-scroll" aria-live="polite">
        <div id="chatContainer" class="chat-container"></div>
      </div>

      <section id="logsDrawer" class="logs-drawer" aria-label="Registro de logs">
        <div class="logs-header">
          <span>Registro de actividad y diagnóstico</span>
          <div style="display:flex; gap:6px;">
            <button id="copyLogsBtn" type="button" style="padding:3px 8px; font-size:0.74rem;">Copiar</button>
            <button id="clearLogsBtn" type="button" style="padding:3px 8px; font-size:0.74rem;">Limpiar</button>
          </div>
        </div>
        <div id="logsBody" class="logs-body"></div>
      </section>

      <div class="composer-wrap">
        <div class="composer">
          <div id="attachmentsPreview" class="attachments-preview"></div>
          <textarea id="promptInput" enterkeyhint="send" placeholder="Escribe un mensaje, pega código o adjunta archivos/imágenes... (Enter envía, Shift+Enter salto de línea)"></textarea>
          <div class="composer-bottom">
            <div class="tools-left">
              <label class="chip" style="cursor:pointer;">
                <span>+ Imagen</span>
                <input id="imageInput" type="file" accept="image/*" multiple hidden />
              </label>
              <label class="chip" style="cursor:pointer;">
                <span>+ Archivo</span>
                <input id="fileInput" type="file" accept=".txt,.md,.json,.js,.ts,.py,.html,.css,.sql,.csv,.log,.xml,.yaml,.yml" multiple hidden />
              </label>
              <span id="statusText" class="status-text">Listo</span>
            </div>

            <button id="sendBtn" class="primary" type="button">Enviar</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const KEYS = {
      sessions: "puter_studio_sessions_v2",
      activeSession: "puter_studio_active_session_v2",
      favorites: "puter_studio_favorites_v2",
      selectedModel: "puter_studio_selected_model_v2"
    };

    const PEAR_ASSET_PATH = "./teto-pera.jpg";

    const FALLBACK_CATALOG = {
      defaultModelId: "claude-3-5-haiku",
      models: [
        {
          id: "claude-3-7-sonnet",
          label: "Claude Sonnet (Mid)",
          category: "claude",
          tier: "mid",
          favorite: true,
          notes: "Balance entre código, redacción y costo contenido."
        },
        {
          id: "claude-3-5-haiku",
          label: "Claude Haiku (Económico)",
          category: "claude",
          tier: "economy",
          favorite: true,
          notes: "Rápido y económico para uso diario."
        },
        {
          id: "deepseek-reasoner",
          label: "DeepSeek Reasoner (Razonamiento Mid)",
          category: "reasoning",
          tier: "mid",
          favorite: true,
          notes: "Razonamiento paso a paso y depuración."
        },
        {
          id: "deepseek-chat",
          label: "DeepSeek Chat (Programación Económica)",
          category: "coding",
          tier: "economy",
          favorite: true,
          notes: "Generación y revisión de código de bajo costo."
        }
      ]
    };

    let models = [];
    let favorites = new Set(loadJsonSafe(KEYS.favorites, []));
    let currentModelId = localStorage.getItem(KEYS.selectedModel) || "";
    let sessions = loadJsonSafe(KEYS.sessions, []);
    let activeSessionId = localStorage.getItem(KEYS.activeSession) || "";
    let attachedImages = []; // { name, dataUrl }
    let attachedFiles = [];  // { name, content, truncated }
    let logs = [];
    let isSending = false;

    const sidebar = document.getElementById("sidebar");
    const openSidebarBtn = document.getElementById("openSidebarBtn");
    const closeSidebarBtn = document.getElementById("closeSidebarBtn");
    const newChatBtn = document.getElementById("newChatBtn");
    const sessionsList = document.getElementById("sessionsList");
    const categoryFilter = document.getElementById("categoryFilter");
    const modelSelect = document.getElementById("modelSelect");
    const favToggleBtn = document.getElementById("favToggleBtn");
    const modelPill = document.getElementById("modelPill");
    const chatScroll = document.getElementById("chatScroll");
    const chatContainer = document.getElementById("chatContainer");
    const promptInput = document.getElementById("promptInput");
    const imageInput = document.getElementById("imageInput");
    const fileInput = document.getElementById("fileInput");
    const attachmentsPreview = document.getElementById("attachmentsPreview");
    const sendBtn = document.getElementById("sendBtn");
    const statusText = document.getElementById("statusText");
    const logsDrawer = document.getElementById("logsDrawer");
    const logsBody = document.getElementById("logsBody");
    const logCount = document.getElementById("logCount");
    const toggleLogsBtn = document.getElementById("toggleLogsBtn");
    const quickLogsBtn = document.getElementById("quickLogsBtn");
    const copyLogsBtn = document.getElementById("copyLogsBtn");
    const clearLogsBtn = document.getElementById("clearLogsBtn");
    const exportMdBtn = document.getElementById("exportMdBtn");
    const exportJsonBtn = document.getElementById("exportJsonBtn");
    const quickExportBtn = document.getElementById("quickExportBtn");
    const wipeAllBtn = document.getElementById("wipeAllBtn");

    function loadJsonSafe(key, fallback) {
      try {
        const raw = localStorage.getItem(key);
        if (!raw) return fallback;
        const parsed = JSON.parse(raw);
        return parsed ?? fallback;
      } catch {
        return fallback;
      }
    }

    function saveJsonSafe(key, value) {
      try {
        localStorage.setItem(key, JSON.stringify(value));
        return true;
      } catch (err) {
        addLog("warn", `No se pudo guardar en localStorage (${key}): ${err?.message || err}`);
        return false;
      }
    }

    function addLog(level, message) {
      const now = new Date();
      const time = now.toTimeString().split(" ")[0];
      const entry = { time, level, message: String(message) };
      logs.push(entry);
      if (logs.length > 300) logs.shift();

      const line = document.createElement("div");
      line.className = `log-line ${level}`;
      line.textContent = `[${entry.time}] [${level.toUpperCase()}] ${entry.message}`;
      logsBody.appendChild(line);
      logsBody.scrollTop = logsBody.scrollHeight;
      logCount.textContent = String(logs.length);
    }

    function setStatus(msg, type = "") {
      statusText.textContent = msg;
      statusText.className = `status-text ${type}`.trim();
    }

    function verifyPearAsset() {
      const probe = new Image();
      probe.onload = () => {
        addLog("ok", `Imagen de fondo cargada (${PEAR_ASSET_PATH}, ${probe.naturalWidth}x${probe.naturalHeight}).`);
      };
      probe.onerror = () => {
        addLog("warn", `No se pudo cargar ${PEAR_ASSET_PATH}. Verifica que exista en la raíz del repositorio.`);
      };
      probe.src = `${PEAR_ASSET_PATH}?v=${Date.now()}`;
    }

    function createSession(title = "Nueva conversación") {
      const id = `chat_${Date.now()}_${Math.random().toString(36).slice(2, 7)}`;
      return {
        id,
        title,
        createdAt: new Date().toISOString(),
        messages: [
          {
            role: "system",
            text: "Sesión lista. Selecciona un modelo económico/mid, marca favoritos y adjunta imágenes o archivos si lo necesitas.",
            model: "",
            timestamp: new Date().toISOString()
          }
        ]
      };
    }

    function getActiveSession() {
      let found = sessions.find(s => s.id === activeSessionId);
      if (!found) {
        if (sessions.length === 0) {
          found = createSession();
          sessions.push(found);
        } else {
          found = sessions[0];
        }
        activeSessionId = found.id;
        localStorage.setItem(KEYS.activeSession, activeSessionId);
        saveJsonSafe(KEYS.sessions, sessions);
      }
      return found;
    }

    function persistSessions() {
      saveJsonSafe(KEYS.sessions, sessions);
      localStorage.setItem(KEYS.activeSession, activeSessionId);
    }

    function renderSessionsList() {
      sessionsList.innerHTML = "";
      sessions.forEach(sess => {
        const row = document.createElement("div");
        row.className = `session-item ${sess.id === activeSessionId ? "active" : ""}`;
        row.title = sess.title;

        const titleSpan = document.createElement("span");
        titleSpan.className = "session-title";
        titleSpan.textContent = sess.title;
        titleSpan.addEventListener("click", () => {
          activeSessionId = sess.id;
          persistSessions();
          renderSessionsList();
          renderChat();
          sidebar.classList.remove("open");
          addLog("info", `Cambiado a sesión: ${sess.id}`);
        });

        const delBtn = document.createElement("button");
        delBtn.type = "button";
        delBtn.className = "session-del";
        delBtn.textContent = "✕";
        delBtn.title = "Eliminar conversación";
        delBtn.addEventListener("click", (e) => {
          e.stopPropagation();
          sessions = sessions.filter(s => s.id !== sess.id);
          if (sessions.length === 0) {
            const fresh = createSession();
            sessions.push(fresh);
            activeSessionId = fresh.id;
          } else if (activeSessionId === sess.id) {
            activeSessionId = sessions[0].id;
          }
          persistSessions();
          renderSessionsList();
          renderChat();
          addLog("info", `Eliminada conversación ${sess.id}`);
        });

        row.append(titleSpan, delBtn);
        sessionsList.appendChild(row);
      });
    }

    function renderChat() {
      const session = getActiveSession();
      chatContainer.innerHTML = "";

      session.messages.forEach(msg => {
        const card = document.createElement("div");
        card.className = `msg ${msg.role || "assistant"}`;

        const head = document.createElement("div");
        head.className = "msg-head";

        const roleLabel = document.createElement("span");
        roleLabel.textContent =
          msg.role === "user" ? "Tú" :
          msg.role === "system" ? "Sistema" :
          msg.role === "error" ? "Error" :
          (msg.model || "Asistente");

        const timeLabel = document.createElement("span");
        if (msg.timestamp) {
          const d = new Date(msg.timestamp);
          if (!Number.isNaN(d.getTime())) {
            timeLabel.textContent = d.toTimeString().split(" ")[0];
          }
        }

        head.append(roleLabel, timeLabel);

        const body = document.createElement("div");
        body.textContent = msg.text || "";

        card.append(head, body);
        chatContainer.appendChild(card);
      });

      chatScroll.scrollTop = chatScroll.scrollHeight;
    }

    function renderAttachments() {
      attachmentsPreview.innerHTML = "";

      attachedImages.forEach((img, idx) => {
        const chip = document.createElement("div");
        chip.className = "chip";

        const thumb = document.createElement("img");
        thumb.src = img.dataUrl;
        thumb.alt = img.name;

        const label = document.createElement("span");
        label.textContent = img.name;

        const rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "×";
        rm.addEventListener("click", () => {
          attachedImages.splice(idx, 1);
          renderAttachments();
        });

        chip.append(thumb, label, rm);
        attachmentsPreview.appendChild(chip);
      });

      attachedFiles.forEach((file, idx) => {
        const chip = document.createElement("div");
        chip.className = "chip";

        const label = document.createElement("span");
        label.textContent = `📄 ${file.name}${file.truncated ? " [recortado]" : ""}`;

        const rm = document.createElement("button");
        rm.type = "button";
        rm.textContent = "×";
        rm.addEventListener("click", () => {
          attachedFiles.splice(idx, 1);
          renderAttachments();
        });

        chip.append(label, rm);
        attachmentsPreview.appendChild(chip);
      });
    }

    function updateModelBarInfo() {
      const m = models.find(item => item.id === currentModelId);
      if (!m) {
        modelPill.textContent = "";
        favToggleBtn.classList.remove("active");
        return;
      }
      favToggleBtn.classList.toggle("active", favorites.has(m.id));
      modelPill.textContent = `${m.category} · ${m.tier || "mid"} — ${m.notes || ""}`;
    }

    function populateModelSelect() {
      const filter = categoryFilter.value;
      const filtered = models.filter(m => {
        if (filter === "all") return true;
        if (filter === "favorites") return favorites.has(m.id);
        return m.category === filter;
      });

      const list = filtered.length > 0 ? filtered : models;
      modelSelect.innerHTML = "";

      list.forEach(m => {
        const opt = document.createElement("option");
        opt.value = m.id;
        opt.textContent = `${favorites.has(m.id) ? "★ " : ""}${m.label} (${m.id})`;
        modelSelect.appendChild(opt);
      });

      if (list.some(m => m.id === currentModelId)) {
        modelSelect.value = currentModelId;
      } else if (list.length > 0) {
        currentModelId = list[0].id;
        modelSelect.value = currentModelId;
        localStorage.setItem(KEYS.selectedModel, currentModelId);
      }

      updateModelBarInfo();
    }

    async function loadCatalog() {
      addLog("info", "Cargando catálogo desde ./models.json...");
      try {
        const res = await fetch("./models.json", { cache: "no-store" });
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        if (!Array.isArray(data.models) || data.models.length === 0) {
          throw new Error("models.json sin lista válida de modelos");
        }
        models = data.models;

        if (favorites.size === 0) {
          models.filter(m => m.favorite).forEach(m => favorites.add(m.id));
          saveJsonSafe(KEYS.favorites, [...favorites]);
        }

        if (!currentModelId) {
          currentModelId = data.defaultModelId || models[0].id;
        }
        addLog("ok", `Catálogo cargado (${models.length} modelos).`);
      } catch (err) {
        models = FALLBACK_CATALOG.models;
        if (!currentModelId) currentModelId = FALLBACK_CATALOG.defaultModelId;
        setStatus("Catálogo local de respaldo activo", "err");
        addLog("warn", `Fallo al cargar models.json (${err?.message || err}). Usando respaldo.`);
      }
      populateModelSelect();
    }

    function downloadFile(filename, content, mimeType) {
      const blob = new Blob([content], { type: mimeType });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function exportMarkdown() {
      const session = getActiveSession();
      const safeTitle = (session.title || "conversacion")
        .toLowerCase()
        .replace(/[^a-z0-9-_]+/gi, "-")
        .replace(/^-|-$/g, "") || "conversacion";

      const md = [
        `# ${session.title || "Conversación"}`,
        `- Fecha: ${session.createdAt || new Date().toISOString()}`,
        `- Modelo actual: ${currentModelId || "N/A"}`,
        "",
        ...session.messages.map(m => {
          const who =
            m.role === "user" ? "Tú" :
            m.role === "system" ? "Sistema" :
            m.role === "error" ? "Error" :
            `Asistente (${m.model || "modelo"})`;
          return `## ${who}\n\n${m.text || ""}\n`;
        })
      ].join("\n");

      downloadFile(`${safeTitle}.md`, md, "text/markdown;charset=utf-8");
      addLog("ok", `Exportada conversación a ${safeTitle}.md`);
    }

    function exportJson() {
      const session = getActiveSession();
      const payload = {
        exportedAt: new Date().toISOString(),
        selectedModel: currentModelId,
        session
      };
      downloadFile(`${session.id}.json`, JSON.stringify(payload, null, 2), "application/json;charset=utf-8");
      addLog("ok", `Exportada conversación a ${session.id}.json`);
    }

    function extractReplyText(response) {
      if (typeof response === "string") return response;
      if (!response) return "";
      const candidate =
        response?.message?.content ??
        response?.result?.message?.content ??
        response?.text ??
        response?.content ??
        response;

      if (typeof candidate === "string") return candidate;
      if (Array.isArray(candidate)) {
        return candidate
          .map(part => (typeof part === "string" ? part : part?.text || ""))
          .filter(Boolean)
          .join("\n");
      }
      return JSON.stringify(candidate, null, 2);
    }

    async function sendPrompt() {
      if (isSending) return;

      const text = promptInput.value.trim();
      if (!text && attachedImages.length === 0 && attachedFiles.length === 0) {
        setStatus("Escribe un mensaje o adjunta un archivo/imagen", "err");
        return;
      }

      if (!window.puter || !puter.ai || typeof puter.ai.chat !== "function") {
        setStatus("SDK de Puter.js no disponible", "err");
        addLog("err", "window.puter.ai.chat no está disponible.");
        return;
      }

      const session = getActiveSession();
      isSending = true;
      sendBtn.disabled = true;
      setStatus("Enviando...", "");

      const filesBlock = attachedFiles
        .map(f => `\n--- Archivo: ${f.name} ---\n${f.content}\n--- Fin archivo ---`)
        .join("\n");

      const fullPrompt = `${text}${filesBlock}`.trim();

      const summaryParts = [];
      if (text) summaryParts.push(text);
      if (attachedFiles.length) summaryParts.push(`[Archivos: ${attachedFiles.map(f => f.name).join(", ")}]`);
      if (attachedImages.length) summaryParts.push(`[Imágenes: ${attachedImages.length}]`);
      const userDisplayText = summaryParts.join("\n");

      if (session.title === "Nueva conversación" && text) {
        session.title = text.slice(0, 38) + (text.length > 38 ? "..." : "");
      }

      session.messages.push({
        role: "user",
        text: userDisplayText,
        model: currentModelId,
        timestamp: new Date().toISOString()
      });

      const assistantMsg = {
        role: "assistant",
        text: "Pensando...",
        model: currentModelId,
        timestamp: new Date().toISOString()
      };
      session.messages.push(assistantMsg);

      persistSessions();
      renderSessionsList();
      renderChat();

      const payload = attachedImages.length > 0
        ? [
            {
              role: "user",
              content: [
                ...(fullPrompt ? [{ type: "text", text: fullPrompt }] : []),
                ...attachedImages.map(img => ({
                  type: "image_url",
                  image_url: { url: img.dataUrl }
                }))
              ]
            }
          ]
        : fullPrompt;

      promptInput.value = "";
      attachedImages = [];
      attachedFiles = [];
      renderAttachments();

      const t0 = performance.now();
      addLog("info", `Petición iniciada -> modelo: ${currentModelId}`);

      try {
        const rawResponse = await puter.ai.chat(payload, { model: currentModelId });
        const elapsed = Math.round(performance.now() - t0);
        const reply = extractReplyText(rawResponse).trim() || "(Respuesta vacía)";
        assistantMsg.text = reply;
        assistantMsg.timestamp = new Date().toISOString();
        setStatus(`Listo (${elapsed} ms)`, "ok");
        addLog("ok", `Respuesta recibida de ${currentModelId} en ${elapsed} ms.`);
      } catch (err) {
        const elapsed = Math.round(performance.now() - t0);
        const errMsg = err?.message || String(err);
        assistantMsg.role = "error";
        assistantMsg.text = `Error con "${currentModelId}": ${errMsg}`;
        assistantMsg.timestamp = new Date().toISOString();
        setStatus("Error en consulta", "err");
        addLog("err", `Fallo en ${currentModelId} tras ${elapsed} ms: ${errMsg}`);
      } finally {
        persistSessions();
        renderChat();
        isSending = false;
        sendBtn.disabled = false;
      }
    }

    // Eventos UI
    openSidebarBtn.addEventListener("click", () => sidebar.classList.add("open"));
    closeSidebarBtn.addEventListener("click", () => sidebar.classList.remove("open"));

    newChatBtn.addEventListener("click", () => {
      const fresh = createSession();
      sessions.unshift(fresh);
      activeSessionId = fresh.id;
      persistSessions();
      renderSessionsList();
      renderChat();
      sidebar.classList.remove("open");
      addLog("info", `Nueva sesión creada: ${fresh.id}`);
    });

    wipeAllBtn.addEventListener("click", () => {
      sessions = [createSession()];
      activeSessionId = sessions[0].id;
      persistSessions();
      renderSessionsList();
      renderChat();
      addLog("warn", "Todo el historial de sesiones fue borrado.");
    });

    favToggleBtn.addEventListener("click", () => {
      if (!currentModelId) return;
      if (favorites.has(currentModelId)) {
        favorites.delete(currentModelId);
        addLog("info", `Quitado de favoritos: ${currentModelId}`);
      } else {
        favorites.add(currentModelId);
        addLog("info", `Agregado a favoritos: ${currentModelId}`);
      }
      saveJsonSafe(KEYS.favorites, [...favorites]);
      populateModelSelect();
    });

    categoryFilter.addEventListener("change", populateModelSelect);

    modelSelect.addEventListener("change", () => {
      currentModelId = modelSelect.value;
      localStorage.setItem(KEYS.selectedModel, currentModelId);
      updateModelBarInfo();
      addLog("info", `Modelo seleccionado: ${currentModelId}`);
    });

    imageInput.addEventListener("change", async (e) => {
      const files = [...(e.target.files || [])];
      for (const f of files) {
        if (f.size > 4 * 1024 * 1024) {
          setStatus(`Imagen > 4MB omitida: ${f.name}`, "err");
          addLog("warn", `Imagen omitida por tamaño (>4MB): ${f.name}`);
          continue;
        }
        try {
          const dataUrl = await new Promise((resolve, reject) => {
            const reader = new FileReader();
            reader.onload = () => resolve(reader.result);
            reader.onerror = () => reject(new Error("Error leyendo imagen"));
            reader.readAsDataURL(f);
          });
          attachedImages.push({ name: f.name, dataUrl });
          addLog("info", `Imagen adjuntada: ${f.name}`);
        } catch (err) {
          addLog("err", `Error adjuntando imagen ${f.name}: ${err.message}`);
        }
      }
      renderAttachments();
      e.target.value = "";
    });

    fileInput.addEventListener("change", async (e) => {
      const files = [...(e.target.files || [])];
      const MAX_CHARS = 25000;
      for (const f of files) {
        try {
          const raw = await f.text();
          const truncated = raw.length > MAX_CHARS;
          const content = truncated ? raw.slice(0, MAX_CHARS) : raw;
          attachedFiles.push({ name: f.name, content, truncated });
          addLog("info", `Archivo adjuntado: ${f.name} (${content.length} chars${truncated ? ", recortado" : ""})`);
        } catch (err) {
          addLog("err", `Error leyendo archivo ${f.name}: ${err.message}`);
        }
      }
      renderAttachments();
      e.target.value = "";
    });

    function toggleLogsDrawer() {
      logsDrawer.classList.toggle("open");
    }

    toggleLogsBtn.addEventListener("click", toggleLogsDrawer);
    quickLogsBtn.addEventListener("click", toggleLogsDrawer);

    clearLogsBtn.addEventListener("click", () => {
      logs = [];
      logsBody.innerHTML = "";
      logCount.textContent = "0";
    });

    copyLogsBtn.addEventListener("click", async () => {
      const text = logs.map(l => `[${l.time}] [${l.level.toUpperCase()}] ${l.message}`).join("\n");
      try {
        await navigator.clipboard.writeText(text);
        setStatus("Logs copiados", "ok");
      } catch {
        setStatus("No se pudo copiar al portapapeles", "err");
      }
    });

    exportMdBtn.addEventListener("click", exportMarkdown);
    quickExportBtn.addEventListener("click", exportMarkdown);
    exportJsonBtn.addEventListener("click", exportJson);

    sendBtn.addEventListener("click", sendPrompt);
    promptInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendPrompt();
      }
    });

    window.addEventListener("error", (e) => {
      addLog("err", `Error global: ${e.message || "Error desconocido"}`);
    });

    window.addEventListener("unhandledrejection", (e) => {
      addLog("err", `Promesa rechazada: ${e.reason?.message || e.reason || "Sin detalle"}`);
    });

    // Arranque
    addLog("info", "Inicializando interfaz Puter Studio...");
    verifyPearAsset();
    getActiveSession();
    renderSessionsList();
    renderChat();
    loadCatalog();
  </script>
</body>
</html>
